<title>🚀Edge</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
 --mx:50vw;--my:50vh;
 min-height:100vh;padding:8vh 20px 40px;
 background:#000;color:#eaeaea;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
 Roboto,Helvetica,Arial,sans-serif;
 overflow-x:hidden
}
body:before{
 content:"";position:fixed;inset:0;z-index:0;
 background-image:
 linear-gradient(rgba(255,255,255,.12) 1px,transparent 1px),
 linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px);
 background-size:40px 40px;
 animation:grid 15s linear infinite;
 pointer-events:none
}
body:after{
 content:"";position:fixed;inset:0;z-index:0;
 background:radial-gradient(circle 600px at var(--mx) var(--my),
 rgba(50,145,255,.08),transparent 80%);
 pointer-events:none
}
@keyframes grid{
 to{background-position:40px 40px}
}
body.white-theme{
 background:#fff;color:#111
}
body.white-theme:before{
 background-image:
 linear-gradient(rgba(0,0,0,.05) 1px,transparent 1px),
 linear-gradient(90deg,rgba(0,0,0,.05) 1px,transparent 1px)
}
body.white-theme:after{
 background:radial-gradient(circle 600px at var(--mx) var(--my),
 rgba(0,112,243,.05),transparent 80%)
}
.container{
 position:relative;z-index:2;
 width:100%;max-width:800px;margin:auto
}
.header{
 display:flex;justify-content:space-between;
 align-items:center;margin-bottom:24px;
 padding-bottom:16px;
 border-bottom:1px solid rgba(255,255,255,.15)
}
body.white-theme .header{
 border-bottom-color:rgba(0,0,0,.1)
}
.logo-area{display:flex;align-items:center;gap:16px}
.logo-svg{width:42px;height:42px;fill:currentColor}
.logo-text{font-size:28px;font-weight:700}
.theme-toggle{
 width:42px;height:42px;cursor:pointer;
 display:flex;align-items:center;justify-content:center
}
.theme-toggle svg{width:32px;height:32px}
.moon-icon{display:block}
.sun-icon{display:none}
body.white-theme .moon-icon{display:none}
body.white-theme .sun-icon{display:block}
textarea{
 width:100%;min-height:320px;padding:22px 24px;
 resize:vertical;outline:none;
 border-radius:16px;
 background:rgba(255,255,255,.06);
 border:1px solid rgba(255,255,255,.15);
 color:#eaeaea;
 font:15px ui-monospace,Consolas,monospace
}
textarea:focus{border-color:#3291ff}
body.white-theme textarea{
 background:rgba(255,255,255,.65);
 color:#111;border-color:rgba(0,0,0,.12)
}
.settings-card{
 display:flex;align-items:center;gap:16px;
 margin:24px 0;padding:14px 18px;
 border:1px solid rgba(255,255,255,.15);
 border-radius:12px;background:rgba(0,0,0,.6)
}
body.white-theme .settings-card{
 background:rgba(255,255,255,.65);
 border-color:rgba(0,0,0,.1)
}
.setting-label{white-space:nowrap;font-size:14px}
.custom-select-wrapper{
 flex:1;max-width:55%;position:relative
}
.custom-select-trigger{
 display:flex;justify-content:space-between;
 align-items:center;padding:8px 12px;
 border:1px solid rgba(255,255,255,.25);
 border-radius:8px;background:#111;
 font:13px ui-monospace,Consolas,monospace;
 cursor:pointer
}
body.white-theme .custom-select-trigger{
 background:rgba(255,255,255,.8);
 color:#111;border-color:rgba(0,0,0,.15)
}
.custom-options{
 position:absolute;top:calc(100% + 8px);
 left:0;right:0;z-index:100;
 opacity:0;visibility:hidden;
 transform:translateY(-8px);
 transition:.2s;
 border:1px solid rgba(255,255,255,.15);
 border-radius:12px;
 background:rgba(20,20,20,.95);
 overflow:hidden
}
.custom-select-wrapper.open .custom-options{
 opacity:1;visibility:visible;transform:none
}
.custom-option{
 padding:12px 16px;cursor:pointer;
 font:13px ui-monospace,Consolas,monospace
}
.custom-option:hover,.custom-option.selected{
 background:rgba(50,145,255,.15);color:#3291ff
}
.actions{
 display:flex;justify-content:flex-end;
 gap:16px;margin-bottom:30px;flex-wrap:wrap
}
.btn{
 flex:1;min-width:120px;padding:12px 28px;
 border:0;border-radius:40px;
 background:#fff;color:#000;
 font-weight:600;cursor:pointer
}
body.white-theme .btn{

}
#getRandomLinkBtn{

.results{display:flex;flex-direction:column;gap:16px}
.result-item{

 padding:18px 24px;border-radius:12px;
 background:rgba(0,0,0,.7);
 border:1px solid rgba(0,112,243,.4)

body.white-theme .result-item{

.icon-box{margin-right:18px;color:#3291ff}
.info-group{flex:1;display:flex;flex-direction:column;gap:6px}
.url{

body.white-theme .url{color:#111}
.auto-copy-tag{

}

.import-card,.download-card{

.import-card{display:none}
.import-header{

.app-list{display:flex;flex-direction:column;gap:12px}
.app-btn{
 width:100%;display:flex;align-items:center;
 padding:14px 20px;border-radius:12px;
 background:rgba(255,255,255,.03);
 border:1px solid rgba(255,255,255,.1);
 color:#eaeaea;cursor:pointer

body.white-theme .app-btn{
 background:rgba(255,255,255,.4);

.app-icon{width:24px;height:24px;object-fit:contain}
.app-name{margin-left:16px;flex:1;text-align:left}
.os-tabs{
 display:flex;gap:8px;margin-bottom:16px;

.os-tab{

 border:1px solid rgba(255,255,255,.1);
 background:rgba(255,255,255,.05);
 color:#eaeaea;cursor:pointer
}
.os-tab.active{

}
body.white-theme .os-tab{

body.white-theme .os-tab.active{

.dl-item{margin-bottom:10px}
.dl-links{
 display:none;flex-direction:column;
 gap:8px;padding:8px 8px 8px 46px
}
.dl-links.open{display:flex}
.dl-link{

}
.dl-link-icon{width:16px;height:16px}
.dl-chevron{
 width:18px;height:18px;transition:.2s;opacity:.6

@media(max-width:600px){

<script>
const $=s=>document.querySelector(s)
const $$=s=>document.querySelectorAll(s)

document.addEventListener("mousemove",e=>{
 document.body.style.setProperty("--mx",e.clientX+"px")
 document.body.style.setProperty("--my",e.clientY+"px")
})

const canvas=$("#particle-canvas")
const ctx=canvas.getContext("2d")
let width,height,particles=[]

function resizeCanvas(){
 width=canvas.width=innerWidth
 height=canvas.height=innerHeight
 particles=Array.from({
  length:Math.floor(width*height/5000)
 },()=>({
  x:Math.random()*width,
  y:Math.random()*height,
  vx:(Math.random()-.5)*.5,
  vy:(Math.random()-.5)*.5,
  r:Math.random()*1.2+.4
 }))
}
function animate(){
 ctx.clearRect(0,0,width,height)
 const white=document.body.classList.contains("white-theme")
 ctx.fillStyle=white?
 "rgba(0,112,243,.4)":"rgba(50,145,255,.5)"
 for(const p of particles){
  p.x+=p.vx
  p.y+=p.vy
  if(p.x<0||p.x>width)p.vx*=-1
  if(p.y<0||p.y>height)p.vy*=-1
  ctx.beginPath()
  ctx.arc(p.x,p.y,p.r,0,Math.PI*2)
  ctx.fill()
 }
 requestAnimationFrame(animate)
}
resizeCanvas()
animate()
addEventListener("resize",resizeCanvas)

const select=$("#customSelectWrapper")
const trigger=$("#customSelectTrigger")
const hidden=$("#subDomainSelect")

trigger.onclick=e=>{
 e.stopPropagation()
 select.classList.toggle("open")
}
$$(".custom-option").forEach(o=>{
 o.onclick=()=>{
  hidden.value=o.dataset.value
  $(".custom-select-trigger span").textContent=o.dataset.value
  $$(".custom-option").forEach(x=>x.classList.remove("selected"))
  o.classList.add("selected")
  select.classList.remove("open")
 }
})
document.onclick=()=>select.classList.remove("open")

$("#themeToggle").onclick=()=>{
 document.body.classList.toggle("white-theme")
}

const input=$("#urlInput")
const results=$("#resultsContainer")
const importCard=$("#importCard")
let currentFinalSubUrl=""

function decodeBase64(str){
 try{
  return decodeURIComponent(escape(atob(str)))
 }catch{
  try{return atob(str)}catch{return str}
 }
}

function extractValue(code,name){
 const re=new RegExp(
  "(?:const|let|var)\\\\s+"+name+
  "\\\\s*=\\\\s*(?:process\\\\.env\\\\.[A-Za-z0-9_]+\\\\s*\\\\|\\\\|\\\\s*)?(['\\\"`])(.*?)\\\\1",
  "i"
 )
 const m=code.match(re)
 return m?m[2]:null
}

function parseConfig(code){
 code=code.replace(
  /\\\\u([0-9a-fA-F]{4})/g,
  (_,h)=>String.fromCharCode(parseInt(h,16))
 )
 const domain=extractValue(code,"DOMAIN")
 const path=extractValue(code,"SUB_PATH")
 return domain&&path?{domain,path}:null
}

function buildUrl(domain,path){
 return "https://"+
 domain.replace(/^https?:\/\//,"")+
 "/"+path.replace(/^\/+/,"")
}

function directNode(link){
 const m=link.match(
  /vless:\\/\\/([a-fA-F0-9-]+)@[^?]+\\?([^#\\n\\r]+)/
 )
 if(!m)return{success:false,error:"不支持的链接"}
 return{
  success:true,
  url:"https://"+hidden.value+
  "/sub?uuid="+m[1]+"&"+m[2]
 }
}

function render(resultsList){
 results.innerHTML=""
 importCard.style.display="none"
 currentFinalSubUrl=""

 const ok=[]
 for(const item of resultsList){
  if(item.success){
   ok.push(item.url)
   results.insertAdjacentHTML("beforeend",`
   <div class="result-item">
    <div class="icon-box">✓</div>
    <div class="info-group">
     <a class="url" href="${item.url}" target="_blank">
      ${item.url}
     </a>
     <div class="auto-copy-tag">
      已自动复制到剪贴板
     </div>
    </div>
   </div>`)
  }else{
   results.insertAdjacentHTML("beforeend",`
   <div class="result-item fail">
    <div class="icon-box">×</div>
    <div class="info-group">
     <span class="error-msg">${item.error}</span>
    </div>
   </div>`)
  }
 }
 if(ok.length){
  currentFinalSubUrl=ok[0]
  navigator.clipboard?.writeText(ok.join("\n"))
  importCard.style.display="block"
 }
 setTimeout(()=>results.innerHTML="",5000)
}

const proxies=[
 url=>"https://api.allorigins.win/raw?url="+encodeURIComponent(url),
 url=>"https://corsproxy.io/?url="+encodeURIComponent(url),
 url=>"https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(url)
]

async function fetchText(url){
 let last
 for(const make of proxies){
  try{
   const r=await fetch(make(url))
   if(r.ok)return await r.text()
  }catch(e){last=e}
 }
 throw last||new Error("Failed to fetch")
}

async function deepFetch(url){
 try{
  const text=await fetchText(url)
  const decoded=decodeBase64(text)
  return directNode(decoded).success?
   directNode(decoded):directNode(text)
 }catch{
  return{success:false,error:"获取失败"}
 }
}

async function execute(urls){
 const btn=$("#fetchBtn")
 btn.disabled=true
 btn.textContent="获取中..."

 const list=[]
 for(const url of urls){
  if(/^(vless|trojan|ss|vmess):\\/\\//i.test(url)){
   list.push(directNode(url))
   continue
  }
  try{
   const code=await fetchText(url)
   const config=parseConfig(code)
   if(!config){
    list.push({success:false,error:"无法解析订阅"})
    continue
   }
   list.push(await deepFetch(
    buildUrl(config.domain,config.path)
   ))
  }catch{
   list.push({success:false,error:"获取失败"})
  }
 }
 render(list)
 btn.disabled=false
 btn.textContent="生成订阅"
}

$("#fetchBtn").onclick=()=>{
 const urls=input.value.trim()
  .split(/[,、\\s\\n]+/)
  .filter(Boolean)
 if(urls.length)execute(urls)
}

$("#subConverterBtn").onclick=()=>{
 open("https://sub.cmliussss.com/","_blank")
}

$("#getRandomLinkBtn").onclick=async()=>{
 const btn=$("#getRandomLinkBtn")
 btn.disabled=true
 btn.textContent="获取中..."
 try{
  const text=await fetchText(
   "https://raw.githubusercontent.com/ptus815/vc/main/vc.txt"
  )
  let data=text
  try{
   window.__vcUrls=""
   eval(text)
   if(window.__vcUrls)data=window.__vcUrls
  }catch{}
  const urls=data.split(/\\r?\\n/)
   .map(x=>x.trim())
   .filter(x=>/^https?:\\/\\//i.test(x))
  if(!urls.length)throw 0

  input.value=""
  await execute([
   urls[Math.floor(Math.random()*urls.length)]
  ])
 }catch{
  render([{success:false,error:"获取失败"}])
 }finally{
  btn.disabled=false
  btn.textContent="获取订阅链接"
 }
}

$$(".app-btn[data-scheme]").forEach(btn=>{
 btn.onclick=()=>{
  if(!currentFinalSubUrl)return
  const scheme=btn.dataset.scheme
  let target="auto"
  if(/clash|flclash/.test(scheme))target="clash"
  if(/surfboard/.test(scheme))target="surfboard"
  if(/sing-box/.test(scheme))target="singbox"

  const url=
   "https://url.v1.mk/sub?target="+target+
   "&url="+encodeURIComponent(currentFinalSubUrl)+
   "&insert=false&emoji=true&list=false"+
   "&xudp=false&udp=false&tfo=false&expand=true"

  location.href=scheme+encodeURIComponent(url)
 }
})

const icons={
 v2:"https://raw.githubusercontent.com/ptus815/vc/main/icon/v2rayNG.svg",
 clash:"https://raw.githubusercontent.com/ptus815/vc/main/icon/ClashMetaforAndroid.svg",
 fl:"https://raw.githubusercontent.com/ptus815/vc/main/icon/Flclash.svg",
 sing:"https://raw.githubusercontent.com/ptus815/vc/main/icon/singbox.svg",
 hid:"https://raw.githubusercontent.com/ptus815/vc/main/icon/Hiddify.svg",
 neko:"https://raw.githubusercontent.com/ptus815/vc/main/icon/NekoBoxForAndroid.svg",
 kar:"https://raw.githubusercontent.com/ptus815/vc/main/icon/Karing.svg",
 verge:"https://raw.githubusercontent.com/ptus815/vc/main/icon/ClashVergeRev.svg",
 sh:"https://raw.githubusercontent.com/ptus815/vc/main/icon/Shadowrocket.svg"
}

const dlData={
 android:[
  ["FlClash","fl","chen08209/FlClash","android-arm64-v8a.apk"],
  ["v2rayNG","v2","2dust/v2rayNG","universal.apk"],
  ["Clash Meta","clash","MetaCubeX/ClashMetaForAndroid","meta-universal-release.apk"],
  ["Surfboard","fl","getsurfboard/surfboard","universal-release.apk"],
  ["Sing-box","sing","SagerNet/sing-box",null],
  ["Hiddify","hid","hiddify/hiddify-next","Android-universal.apk"],
  ["NekoBox","neko","MatsuriDayo/NekoBoxForAndroid","arm64-v8a.apk"],
  ["Karing","kar","KaringX/karing","android_arm64-v8a.apk"]

  ["Clash Verge Rev","verge","clash-verge-rev/clash-verge-rev","x64-setup.exe"],

function renderOS(os){
 const grid=$("#dlGrid")
 grid.innerHTML=""
 for(const [name,icon,repo,match] of dlData[os]){
  const item=document.createElement("div")
  item.className="dl-item"
  let link=""
  if(match?.startsWith("http")){
   link=`<a class="dl-link" href="${match}" target="_blank">
   ↓ 下载</a>`
  }else if(!repo){
   link=`<a class="dl-link"
   href="https://github.com/SagerNet/sing-box/releases/latest"
   target="_blank">↓ Release</a>`
  }else{
   link=`<a class="dl-link dynamic-dl"
   href="#" data-repo="${repo}" data-match="${match}">
   ↓ <span>获取下载</span></a>`
  }
  item.innerHTML=`
  <button class="app-btn dl-header">
   <img class="app-icon" src="${icons[icon]}">
   <span class="app-name">${name}</span>
   <svg class="dl-chevron" viewBox="0 0 24 24"
   fill="none" stroke="currentColor" stroke-width="2">
   <polyline points="6 9 12 15 18 9"/>
   </svg>
  </button>
  <div class="dl-links">${link}</div>`
  grid.appendChild(item)

  item.querySelector(".dl-header").onclick=()=>{
   const links=item.querySelector(".dl-links")
   const open=links.classList.contains("open")
   $$(".dl-links").forEach(x=>x.classList.remove("open"))
   $$(".dl-chevron").forEach(x=>x.style.transform="")
   if(!open){
    links.classList.add("open")
    item.querySelector(".dl-chevron").style.transform="rotate(180deg)"
   }
  }
 }
}

document.addEventListener("click",async e=>{
 const link=e.target.closest(".dynamic-dl")
 if(!link)return
 e.preventDefault()
 if(link.classList.contains("loading"))return

 link.classList.add("loading")
 const span=link.querySelector("span")
 span.textContent="获取中..."

 try{
  const repo=link.dataset.repo
  const r=await fetch(
   "https://api.github.com/repos/"+repo+
   "/releases/latest"
  )
  if(!r.ok)throw 0
  const data=await r.json()
  const asset=data.assets.find(a=>
   a.name.includes(link.dataset.match)
  )
  if(!asset)throw 0

  location.href=
   "https://jsnzkpg4.pages.dev/"+
   asset.browser_download_url
 }catch{
  open(
   "https://github.com/"+link.dataset.repo+
   "/releases/latest","_blank"
  )
 }finally{
  span.textContent="获取下载"
  link.classList.remove("loading")
 }
})

$$(".os-tab").forEach(tab=>{
 tab.onclick=()=>{
  $$(".os-tab").forEach(x=>x.classList.remove("active"))
  tab.classList.add("active")
  renderOS(tab.dataset.os)
 }
})

renderOS("android")
