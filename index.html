<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀Edge</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            --mouse-x: 50vw; --mouse-y: 50vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh; display: flex; justify-content: center; align-items: flex-start;
            padding: 8vh 20px 40px 20px; transition: background 0.4s ease, color 0.4s ease;
            background: #000000; color: #eaeaea; overflow-x: hidden;
        }
        @keyframes gridMove { 0% { background-position: 0 0; } 100% { background-position: 40px 40px; } }
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.12) 1px, transparent 1px);
            background-size: 40px 40px; pointer-events: none; z-index: 0; transition: background-image 0.4s ease; animation: gridMove 15s linear infinite;
        }
        body::after {
            content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle 600px at var(--mouse-x) var(--mouse-y), rgba(50, 145, 255, 0.08), transparent 80%);
            pointer-events: none; z-index: 0; transition: background 0.4s ease;
        }
        body.white-theme::before {
            background-image: linear-gradient(rgba(0, 0, 0, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
        }
        body.white-theme::after { background: radial-gradient(circle 600px at var(--mouse-x) var(--mouse-y), rgba(0, 112, 243, 0.05), transparent 80%); }
        body.white-theme { background: #ffffff; color: #111111; }
        .container { position: relative; z-index: 2; width: 100%; max-width: 800px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.15); }
        body.white-theme .header { border-bottom-color: rgba(0,0,0,0.1); }
        .logo-area { display: flex; align-items: center; gap: 16px; }
        .logo-svg { width: 42px; height: 42px; fill: currentColor; }
        .logo-text { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
        .theme-toggle { cursor: pointer; display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; -webkit-tap-highlight-color: transparent; }
        .theme-toggle svg { width: 32px; height: 32px; fill: currentColor; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s; }
        .moon-icon { display: block; } .sun-icon { display: none; }
        body.white-theme .moon-icon { display: none; } body.white-theme .sun-icon { display: block; }
        .theme-toggle:hover svg { transform: scale(1.1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        
        textarea {
            width: 100%; padding: 22px 24px; font-size: 15px; font-family: ui-monospace, Consolas, monospace;
            border-radius: 16px; resize: vertical; min-height: 320px;
            background: transparent; border: 1px solid rgba(255, 255, 255, 0.2);
            color: #eaeaea; outline: none; transition: all 0.3s;
        }
        textarea::placeholder { color: rgba(255, 255, 255, 0.4); line-height: 1.8; }
        textarea:focus { border-color: #3291ff; box-shadow: 0 0 0 2px rgba(50, 145, 255, 0.3); }
        body.white-theme textarea { border: 1px solid rgba(0, 0, 0, 0.15); color: #111111; }
        body.white-theme textarea::placeholder { color: rgba(0, 0, 0, 0.4); }
        body.white-theme textarea:focus { border-color: #0070f3; box-shadow: 0 0 0 2px rgba(0, 112, 243, 0.15); }

        .settings-card {
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; padding: 14px 18px; margin: 24px 0;
            display: flex; justify-content: space-between; align-items: center; gap: 16px; position: relative; z-index: 99;
        }
        body.white-theme .settings-card { background: rgba(255, 255, 255, 0.65); border-color: rgba(255, 255, 255, 0.6); }
        .setting-label { font-size: 14px; font-weight: 500; color: #eaeaea; white-space: nowrap; flex-shrink: 0; }
        body.white-theme .setting-label { color: #111111; }
        .custom-select-wrapper { flex: 1; max-width: 55%; position: relative; }
        .custom-select-trigger {
            background: #111111; color: #eaeaea; border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 8px 12px; border-radius: 8px; font-family: ui-monospace, monospace; font-size: 13px;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all 0.3s;
        }
        body.white-theme .custom-select-trigger { background: rgba(255, 255, 255, 0.8); color: #111111; border-color: rgba(0, 0, 0, 0.15); }
        .custom-select-trigger:hover, .custom-select-wrapper.open .custom-select-trigger { border-color: #3291ff; }
        .custom-select-trigger svg { transition: transform 0.3s ease; opacity: 0.7; }
        .custom-select-wrapper.open .custom-select-trigger svg { transform: rotate(180deg); }
        .custom-options {
            position: absolute; top: calc(100% + 8px); left: 0; right: 0; background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px; overflow: hidden; opacity: 0; visibility: hidden; transform: translateY(-10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 100;
        }
        .custom-select-wrapper.open .custom-options { opacity: 1; visibility: visible; transform: translateY(0); }
        body.white-theme .custom-options { background: rgba(255, 255, 255, 0.95); border-color: rgba(0, 0, 0, 0.1); }
        .custom-option {
            padding: 12px 16px; font-size: 13px; font-family: ui-monospace, monospace; cursor: pointer;
            color: rgba(255, 255, 255, 0.8); transition: all 0.2s; display: flex; align-items: center; justify-content: space-between;
        }
        body.white-theme .custom-option { color: #333; }
        .custom-option:hover, .custom-option.selected { background: rgba(50, 145, 255, 0.15); color: #3291ff; }
        .actions { display: flex; justify-content: flex-end; margin-bottom: 30px; gap: 16px; flex-wrap: wrap; }
        .btn {
            background: #ffffff; color: #000000; padding: 12px 28px; border-radius: 40px; border: none;
            cursor: pointer; font-weight: 600; font-size: 14px; transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.15); outline: none; flex: 1; min-width: 120px; text-align: center;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(255, 255, 255, 0.25); }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        body.white-theme .btn { background: #000000; color: #ffffff; }
        #getRandomLinkBtn { background: #3291ff; color: #ffffff; }
        body.white-theme #getRandomLinkBtn { background: #0070f3; }
        .results { display: flex; flex-direction: column; gap: 16px; }
        .result-item {
            display: flex; align-items: center; padding: 18px 24px; border-radius: 12px; background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(0, 112, 243, 0.4);
            position: relative; overflow: hidden;
        }
        .result-item::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #3291ff; }
        body.white-theme .result-item { background: rgba(255, 255, 255, 0.75); }
        .icon-box { margin-right: 18px; color: #3291ff; }
        .info-group { flex: 1; display: flex; flex-direction: column; gap: 6px; }
        .url { font-size: 14px; color: #eaeaea; font-family: ui-monospace, monospace; font-weight: 500; word-break: break-all; text-decoration: none; }
        body.white-theme .url { color: #111; }
        .auto-copy-tag { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #3291ff; font-weight: 600; }
        .result-item.fail { border-color: rgba(255, 50, 50, 0.4); }
        .result-item.fail::before { background: #ff3333; }
        .result-item.fail .icon-box { color: #ff3333; }
        .result-item.fail .error-msg { font-size: 14px; color: #ff5555; }
        .import-card, .download-card { background: transparent; border: none; margin-top: 16px; }
        .import-card { display: none; }
        .download-card { display: block; margin-top: 30px; }
        .import-header { text-align: center; font-size: 16px; font-weight: 600; margin-bottom: 20px; color: #eaeaea; }
        body.white-theme .import-header { color: #111111; }
        .app-list { display: flex; flex-direction: column; gap: 12px; }
        .app-btn {
            width: 100%; display: flex; align-items: center; padding: 14px 20px; border-radius: 12px;
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); cursor: pointer;
            transition: all 0.25s; color: #eaeaea; outline: none;
        }
        body.white-theme .app-btn { background: rgba(255, 255, 255, 0.4); border-color: rgba(0, 0, 0, 0.1); color: #111111; }
        .app-btn:hover { border-color: #3291ff; color: #3291ff; transform: translateY(-2px); }
        .app-icon { width: 24px; height: 24px; flex-shrink: 0; object-fit: contain; }
        .app-name { font-size: 15px; font-weight: 500; margin-left: 16px; flex: 1; text-align: left; }
        .os-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; }
        .os-tab { padding: 8px 18px; border-radius: 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #eaeaea; cursor: pointer; }
        .os-tab.active { background: #3291ff; color: #fff; }
        body.white-theme .os-tab { background: rgba(255,255,255,0.6); color: #111; }
        body.white-theme .os-tab.active { background: #0070f3; color: #fff; }
        .dl-item { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
        .dl-chevron { width: 18px; height: 18px; opacity: 0.6; }
        .dl-links { display: none; flex-direction: column; gap: 8px; padding: 4px 8px 8px 46px; }
        .dl-links.open { display: flex; }
        .dl-link { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; color: #3291ff; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body class="white-theme">
<canvas id="particle-canvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none;"></canvas>
<div class="container">

</div>
<script>
    const mouse = { x: -1000, y: -1000 };
    document.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX; mouse.y = e.clientY;
        document.body.style.setProperty('--mouse-x', `${e.clientX}px`);
        document.body.style.setProperty('--mouse-y', `${e.clientY}px`);
    });
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let width, height, particles = [];
    function resizeCanvas() { width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; initParticles(); }
    window.addEventListener('resize', resizeCanvas);
    class Particle {
        constructor() { this.x = Math.random() * width; this.y = Math.random() * height; this.vx = (Math.random() - 0.5) * 0.6; this.vy = (Math.random() - 0.5) * 0.6; this.radius = Math.random() * 1.5 + 0.5; }
        update() {
            this.x += this.vx; this.y += this.vy;
            if (this.x < 0 || this.x > width) this.vx = -this.vx;
            if (this.y < 0 || this.y > height) this.vy = -this.vy;
            const dx = mouse.x - this.x, dy = mouse.y - this.y, dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 150) { this.x -= dx * 0.015; this.y -= dy * 0.015; }
        }
        draw(isWhiteTheme) {
            ctx.fillStyle = isWhiteTheme ? 'rgba(0, 112, 243, 0.4)' : 'rgba(50, 145, 255, 0.5)';
            ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();
        }
    }
    function initParticles() { particles = []; for (let i = 0; i < Math.floor((width * height) / 3000); i++) particles.push(new Particle()); }
    function animateParticles() {
        ctx.clearRect(0, 0, width, height);
        const isWhite = document.body.classList.contains('white-theme');
        const color = isWhite ? '0, 112, 243' : '50, 145, 255';
        for (let p of particles) {
            p.update(); p.draw(isWhite);
            const dist = Math.sqrt((mouse.x - p.x) ** 2 + (mouse.y - p.y) ** 2);
            if (dist < 140) {
                ctx.beginPath(); ctx.strokeStyle = `rgba(${color}, ${0.4 * (1 - dist / 140)})`;
                ctx.lineWidth = 1; ctx.moveTo(p.x, p.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
            }
        }
        requestAnimationFrame(animateParticles);
    }
    resizeCanvas(); animateParticles();

    const customSelectWrapper = document.getElementById('customSelectWrapper');
    const customSelectTrigger = document.getElementById('customSelectTrigger');
    const customOptions = document.querySelectorAll('.custom-option');
    const hiddenSubDomain = document.getElementById('subDomainSelect');
    customSelectTrigger.addEventListener('click', (e) => { customSelectWrapper.classList.toggle('open'); e.stopPropagation(); });
    customOptions.forEach(opt => opt.addEventListener('click', () => {
        customSelectTrigger.querySelector('span').textContent = opt.dataset.value;
        hiddenSubDomain.value = opt.dataset.value;
        customOptions.forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        customSelectWrapper.classList.remove('open');
    }));
    document.addEventListener('click', () => customSelectWrapper.classList.remove('open'));

    const urlInput = document.getElementById('urlInput');
    const promptText = "点击获取订阅链接，\n或直接粘贴 vless://、trojan://、vmess:// 等链接点击生成订阅...\n支持批量，每行一个";
    let charIndex = 0;
    function typeWriterEffect() {
        if (charIndex < promptText.length) {
            urlInput.setAttribute('placeholder', promptText.substring(0, ++charIndex) + '_');
            setTimeout(typeWriterEffect, Math.random() * 40 + 30);
        } else urlInput.setAttribute('placeholder', promptText);
    }
    setTimeout(typeWriterEffect, 600);

    let currentFinalSubUrl = '';
    const resultsContainer = document.getElementById('resultsContainer');
    const importCard = document.getElementById('importCard');

    function copyToClipboard(text) {
        const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    }

    function renderResults(results) {
        resultsContainer.innerHTML = ''; importCard.style.display = 'none'; currentFinalSubUrl = '';
        let html = '', successfulUrls = [];
        for (const item of results) {
            if (item.success) {
                successfulUrls.push(item.url);
                html += `<div class="result-item"><div class="icon-box"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg></div><div class="info-group"><a href="${item.url}" target="_blank" class="url">${item.url}</a><div class="auto-copy-tag">已自动复制到剪贴板</div></div></div>`;
            } else {
                html += `<div class="result-item fail"><div class="icon-box"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></div><div class="info-group"><span class="error-msg">解析失败</span></div></div>`;
            }
        }
        resultsContainer.innerHTML = html;
        if (successfulUrls.length > 0) { currentFinalSubUrl = successfulUrls[0]; copyToClipboard(successfulUrls.join('\n')); importCard.style.display = 'block'; }
    }

    const getRandomLinkBtn = document.getElementById('getRandomLinkBtn');
    getRandomLinkBtn.addEventListener('click', async () => {
        try {
            getRandomLinkBtn.disabled = true; getRandomLinkBtn.textContent = '...';
            const res = await fetch(`/api/node?action=random&subDomain=${encodeURIComponent(hiddenSubDomain.value)}`);
            const data = await res.json();
            renderResults(data.results || []);
        } catch (e) {
            renderResults([{ success: false, error: 'ERR' }]);
        } finally {
            getRandomLinkBtn.disabled = false; getRandomLinkBtn.textContent = '获取订阅链接';
        }
    });

    const fetchBtn = document.getElementById('fetchBtn');
    fetchBtn.addEventListener('click', async () => {
        const raw = urlInput.value.trim(); if (!raw) return;
        const urls = raw.split(/[,、\s\n]+/).filter(s => s.trim() !== '');
        fetchBtn.disabled = true; fetchBtn.textContent = '...';
        try {
            const res = await fetch(`/api/node?subDomain=${encodeURIComponent(hiddenSubDomain.value)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ urls })
            });
            const data = await res.json();
            renderResults(data.results || []);
        } catch (e) {
            renderResults([{ success: false, error: 'ERR' }]);
        } finally {
            fetchBtn.disabled = false; fetchBtn.textContent = '生成订阅';
        }
    });

    document.getElementById('themeToggle').addEventListener('click', () => document.body.classList.toggle('white-theme'));
    document.getElementById('subConverterBtn').addEventListener('click', () => window.open('https://sub.cmliussss.com/', '_blank'));

    document.querySelectorAll('.app-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            if (!currentFinalSubUrl || !this.dataset.scheme) return;
            const scheme = this.dataset.scheme;
            let targetType = 'auto';
            if (scheme.includes('clash') || scheme.includes('flclash')) targetType = 'clash';
            else if (scheme.includes('surfboard')) targetType = 'surfboard';
            else if (scheme.includes('sing-box')) targetType = 'singbox';
            const convertedUrl = `https://subapi.cmliussss.net/sub?target=${targetType}&url=${encodeURIComponent(currentFinalSubUrl)}&insert=false&config=https%3A%2F%2Fraw.githubusercontent.com%2Fcmliu%2FACL4SSR%2Fmain%2FClash%2Fconfig%2FACL4SSR_Online.ini&emoji=true&list=false&xudp=false&udp=false&tfo=false&expand=true&scv=false&fdn=false&new_name=true`;
            window.location.href = scheme + encodeURIComponent(convertedUrl);
        });
    });

    const dlData = {
        android: [
            { name: 'FlClash', repo: 'chen08209/FlClash', match: 'android-arm64-v8a.apk' },
            { name: 'v2rayNG', repo: '2dust/v2rayNG', match: 'universal.apk' }
        ],
        windows: [
            { name: 'Clash Verge Rev', repo: 'clash-verge-rev/clash-verge-rev', match: 'x64-setup.exe' },
            { name: 'FlClash', repo: 'chen08209/FlClash', match: 'windows-amd64-setup.exe' }
        ],
        mac: [{ name: 'Clash Verge Rev', repo: 'clash-verge-rev/clash-verge-rev', match: 'aarch64.dmg' }],
        ios: [{ name: 'Shadowrocket', url: 'https://apps.apple.com/us/app/shadowrocket/id932747118' }],
        linux: [{ name: 'Clash Verge Rev', repo: 'clash-verge-rev/clash-verge-rev', match: 'amd64.deb' }]
    };
    function renderOS(os) {
        const dlGrid = document.getElementById('dlGrid');
        dlGrid.innerHTML = (dlData[os] || []).map(a => `<a class="dl-link" href="${a.url || `https://github.com/${a.repo}/releases/latest`}" target="_blank">${a.name}</a>`).join('');
    }
    document.querySelectorAll('.os-tab').forEach(t => t.addEventListener('click', function() {
        document.querySelectorAll('.os-tab').forEach(x => x.classList.remove('active'));
        this.classList.add('active'); renderOS(this.dataset.os);
    }));
    renderOS('android');
</script>
</body>
</html>
